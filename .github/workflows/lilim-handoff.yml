name: Public Li-Lim functional qualification
on:
  push:
    branches: [bench/lilim-etendu-20261007]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      JULIA_NUM_THREADS: '1'
      JULIA_NUM_GC_THREADS: '1'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up missing solvers and verify frozen sources
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 LiLim/scripts/colleague.jl setup
      - name: Validate actual solvers against original PDPTW
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 LiLim/scripts/colleague.jl qualify
      - name: Prove setup reuses installed packages and Artifacts
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 LiLim/scripts/colleague.jl setup
      - name: Exercise sealed trials, report and English figures
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 LiLim/scripts/colleague.jl run --budget=8 --threads=1 --methods=ortools_native,ghost_icn --instances=lc101 --seeds=41 --output=LiLim/results/ci-functional-smoke

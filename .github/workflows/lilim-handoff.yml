name: Public solver kit qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows_wheel_trees:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - name: Verify upstream archives and Windows Artifact tree hashes
        shell: bash
        run: |
          julia --startup-file=no --threads=1 --gcthreads=1 -e '
          using Pkg, Downloads, SHA
          include("LiLim/src/SolverArtifacts.jl")
          platform = Pkg.BinaryPlatforms.HostPlatform()
          matches = Bool[]
          for package in SolverArtifacts.PACKAGES
              name = package * "_python312"
              meta = Pkg.Artifacts.artifact_meta(name, SolverArtifacts.BINDINGS; platform)
              download = only(meta["download"])
              actual = mktempdir() do directory
                  wheel = joinpath(directory, "sdk.whl")
                  Downloads.download(download["url"], wheel)
                  bytes2hex(sha256(read(wheel))) == download["sha256"] || error("Upstream wheel checksum mismatch")
                  Pkg.Artifacts.create_artifact() do destination
                      run(pipeline(`$(Pkg.PlatformEngines.exe7z()) x -y -o$destination $wheel`; stdout=devnull))
                  end
              end
              println("WINDOWS_TREE|", name, "|", actual)
              push!(matches, string(actual) == meta["git-tree-sha1"])
          end
          all(matches) || error("Windows Artifact bindings require the verified native tree hashes printed above")'
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      JULIA_NUM_THREADS: '1'
      JULIA_NUM_GC_THREADS: '1'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: julia-actions/cache@v3
        with:
          cache-name: lilim-handoff-julia-1.13.1
          delete-old-caches: 'false'
      - name: Require the native OR-Tools SDK before expensive Julia setup
        shell: bash
        run: |
          julia --startup-file=no --threads=1 --gcthreads=1 -e '
          include("LiLim/src/NativeSolvers.jl")
          python = NativeSolvers.default_python(pwd())
          println("Selected Python: ", python)
          try
              identity = NativeSolvers.install_ortools(python; root=pwd())
              println("Native OR-Tools ready: ", identity["ortools_version"], "; Python ", identity["python_version"])
          catch
              paths = NativeSolvers.SolverArtifacts.python_paths()
              probe = `$python -c "import sys; print(sys.version); import ortools; from ortools.constraint_solver import _pywrapcp"`
              paths === nothing || (probe = addenv(probe, "PYTHONPATH"=>NativeSolvers.SolverArtifacts.python_path(paths), "PYTHONNOUSERSITE"=>"1"))
              run(ignorestatus(probe))
              rethrow()
          end'
      - name: Set up missing solvers and verify frozen sources
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 LiLim/scripts/colleague.jl setup --missing-solvers=error
      - name: Fetch checksum-frozen classical original-format qualification inputs
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 -e 'using TOML; include("Hexaly/src/Sources.jl"); ReproductionSources.fetch_sources(pwd(),TOML.parsefile("Hexaly/config/sources.toml"))'
      - name: Validate original PDPTW and discrete models with available native solvers
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 scripts/colleague.jl qualify --output=Hexaly/results/ci-functional.toml
      - name: Prove setup reuses installed packages and Artifacts
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 LiLim/scripts/colleague.jl setup --missing-solvers=error
      - name: Exercise sealed trials, report and English figures
        shell: bash
        run: julia --startup-file=no --threads=1 --gcthreads=1 LiLim/scripts/colleague.jl run --budget=8 --threads=1 --methods=ortools_native,ghost_icn --instances=lc101 --seeds=41 --missing-solvers=error --output=LiLim/results/ci-functional-smoke

schema = "li-lim-existing-strategy-variants/1"
scope = "Additive strategy screening; all historical method names and defaults are retained"
selection = "Opt in with --methods=strategies or --methods=all,strategies; all alone remains historical"

[screening]
instances = ["lc101", "lr101", "lrc101"]
seeds = [41, 42, 43]
first_budget_seconds = 8.0
followup_budgets_seconds = [32.0, 128.0]
first_threads = 1
followup_threads = [1, 2, 4, 8, 16]
selection_policy = "Rank fleet first and distance second per instance; inspect best, mean, median, spread, BKS/time-to-target, CPU and GC. Confirmation uses unexposed official instances and fresh seeds; screening is not confirmation."

[profiles.tabu_short]
tabu = "event"
